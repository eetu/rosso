# Path-filtered CI. A Rust-only PR skips the frontend job and vice versa, so the
# filtered jobs SKIP rather than fail — which is why branch protection must
# require the always-run `ci-gate` aggregator and never the filtered jobs by
# name (a skipped *required* check strands a PR at "waiting for status" forever).
#
# Every `uses:` pins a full commit SHA with a `# vN` comment — tamper-evident,
# and dependabot still bumps the SHA and rewrites the comment. Rolling selectors
# like dtolnay/rust-toolchain@stable stay on the tag by design.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  changes:
    name: "Detect changes"
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yaml'
            backend:
              - 'backend/**'
              - 'integration/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yaml'

  frontend:
    name: "Frontend"
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: frontend/.node-version
      # Yarn is vendored (.yarn/releases/*.cjs) and invoked via node — no
      # corepack (node 25+ dropped the bundle), so this stays node-version
      # agnostic and in step with the Dockerfile's node stage.
      - name: Frontend checks
        working-directory: frontend
        run: |
          yarn() { node .yarn/releases/yarn-*.cjs "$@"; }
          yarn install --immutable
          yarn lint
          yarn format
          yarn typecheck
          yarn test
          yarn build

  backend:
    name: "Backend (Rust workspace)"
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace
      - run: cargo build --workspace --release
      # The integration suite spawns the release binary just built above.
      - run: cargo test -p rosso-integration --release -- --ignored

  ci-gate:
    name: "CI gate"
    if: always()
    needs: [frontend, backend]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          results="${{ needs.frontend.result }} ${{ needs.backend.result }}"
          echo "results: $results"
          for r in $results; do
            case "$r" in
              success|skipped) ;;
              *) echo "a job reported '$r'"; exit 1 ;;
            esac
          done
