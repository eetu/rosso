<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Full-bleed square on an opaque ground, deliberately not pre-rounded: iOS
       and Android round home-screen icons themselves, and a rounded source gets
       double-masked into a smaller squircle with gaps. -->
  <rect width="64" height="64" fill="#0f0f0f"></rect>
  <path d="M18 16 A30 30 0 0 1 48 46" stroke="#e9e9e9" stroke-width="3" stroke-linecap="round"></path>
  <path d="M18 30 A16 16 0 0 1 34 46" stroke="#e9e9e9" stroke-width="2.5" stroke-linecap="round"></path>
  <circle cx="18" cy="46" r="5" fill="#f78f08"></circle>
</svg>
