<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover: edge-to-edge under the notch/home-indicator AND the
         thing that makes env(safe-area-inset-*) resolve non-zero. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- Keep in sync with --halo-body (light/dark). -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f0f0f0"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#0f0f0f"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="rosso" />
    <!-- black-translucent overlays the status bar → pad top chrome with
         env(safe-area-inset-top). -->
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <title>rosso</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
