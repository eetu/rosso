default_job = "run"

[jobs.run]
command = ["cargo", "run", "--color", "always"]
need_stdout = true
background = true
on_change_strategy = "kill_then_restart"
# Config changes hot-reload alongside code: the binary reads backend/.env via
# dotenvy at boot, so a restart is what picks up an edit.
watch = [".env"]

[jobs.check]
command = ["cargo", "check", "--all-targets", "--color", "always"]
need_stdout = false

[jobs.clippy]
command = ["cargo", "clippy", "--all-targets", "--color", "always", "--", "-D", "warnings"]
need_stdout = false

[jobs.test]
command = ["cargo", "test", "--color", "always"]
need_stdout = true
